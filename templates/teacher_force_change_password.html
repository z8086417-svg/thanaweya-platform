{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-icon">🔑</div>
    <h1>{{ L('tchcp.title') }}</h1>
    <p class="auth-sub">{{ L('tchcp.subtitle') }}</p>

    {% if error %}
      <div class="alert alert-error">⚠️ {{ T(error) }}</div>
    {% endif %}

    <form method="post" autocomplete="off">
      <div class="field">
        <label>{{ L('tchcp.new_password') }}</label>
        <input type="password" name="new_password" required minlength="8" autocomplete="new-password" placeholder="{{ L('tchcp.new_password_placeholder') }}">
      </div>
      <div class="field">
        <label>{{ L('tchcp.confirm_password') }}</label>
        <input type="password" name="confirm_password" required minlength="8" autocomplete="new-password" placeholder="{{ L('tchcp.confirm_password_placeholder') }}">
      </div>
      <button class="btn btn-lg btn-block" type="submit">{{ L('action.change_password') }}</button>
    </form>
  </div>
</div>
{% endblock %}
