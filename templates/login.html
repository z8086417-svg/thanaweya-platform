{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-icon">🎓</div>
    <h1>{{ L('login.title') }}</h1>
    <p class="auth-sub">{{ L('login.subtitle') }}</p>

    {% if error %}
      <div class="alert alert-error">⚠️ {{ T(error) }}</div>
    {% endif %}

    <form method="post">
      <div class="field">
        <label>{{ L('login.account_code') }}</label>
        <input type="text" name="account_code" placeholder="{{ L('login.account_code_placeholder') }}" required autofocus dir="ltr">
      </div>
      <div class="field">
        <label>{{ L('login.password') }}</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn btn-lg btn-block" type="submit">{{ L('action.login') }}</button>
    </form>

    <p class="auth-alt">
      {{ L('login.no_account') }} <a href="{{ url_for('student_register') }}">{{ L('login.register_here') }}</a>
    </p>
    <p class="auth-alt">
      <a href="{{ url_for('parent_login') }}">{{ L('login.parent_here') }}</a>
    </p>
  </div>
</div>
{% endblock %}
